name: auto-build
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - feature/update*
    paths:
      # build対象となるsrcファイルに差分がある場合
      - "src/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # secrets.GITHUB_TOKENでcommit&pushしても次のワークフローを起動しないためGitHub Appから一時tokenを発行する
      # see https://github.com/marketplace/actions/create-github-app-token
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3.0.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.generate_token.outputs.token }}
      - name: setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .tool-versions
          cache: "npm"
      - name: Install safe-chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci
      - name: setup node modules
        run: npm ci
      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
      - name: Load version
        uses: ./.github/actions/load-dotenv
        with:
          path: src
      - name: build diagram
        run: |
          mkdir -p src/diagram/build
          npm run prebuild-diagram
          cd src/diagram
          ./gradlew run --args="build/station.json build/diagram.json"
          ./gradlew run --args="build/station.extra.json build/diagram.extra.json"
      - name: build data
        run: npm run build
      - name: Check Diff (out/**)
        id: diff_out
        run: |
          git add -N .
          main=$(git diff --name-only -- out/main/ | wc -l)
          extra=$(git diff --name-only -- out/extra/ | wc -l)
          echo "detected file changes out/main: $main, out/extra: $extra"
          echo "main=$([ "$main" -gt 0 ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
          echo "extra=$([ "$extra" -gt 0 ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
      - name: zip data (main)
        if: steps.diff_out.outputs.main == 'true'
        run: ./src/zip.sh main
      - name: zip data (extra)
        if: steps.diff_out.outputs.extra == 'true'
        run: ./src/zip.sh extra
      - name: update latest info
        # src/.env のバージョン定義も考慮する必要があるため無条件で更新処理を実行する
        run: |
          npm run bump-version-main
          npm run bump-version-extra
      - name: Check Diff (latest_info*.json)
        id: diff_info
        run: |
          info_changes=$(git diff --name-only -- ':(glob)latest_info*.json' | wc -l)
          echo "detected file changes latest_info: $info_changes"
          echo "info=$([ "$info_changes" -gt 0 ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
      - name: Configure GPG
        if: steps.diff_out.outputs.main == 'true' || steps.diff_out.outputs.extra == 'true' || steps.diff_info.outputs.info == 'true'
        uses: ./.github/actions/configure-gpg
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          key-id: ${{ secrets.GPG_KEY_ID }}
          user-email: ${{ secrets.GPG_USER_EMAIL }}
          user-name: ${{ secrets.GPG_USER_NAME }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          key-grip: ${{ secrets.GPG_KEY_GRIP }}
      - name: Commit (out/**)
        if: steps.diff_out.outputs.main == 'true' || steps.diff_out.outputs.extra == 'true'
        run: |
          git add ./out/main ./out/extra
          git commit -m "feat: build v${{ env.VERSION }}"
      - name: Commit (latest info)
        if: steps.diff_info.outputs.info == 'true'
        run: |
          git add ./latest_info*.json
          git commit -m "feat: update version info v${{ env.VERSION }}"
      - name: Push
        if: steps.diff_out.outputs.main == 'true' || steps.diff_out.outputs.extra == 'true' || steps.diff_info.outputs.info == 'true'
        run: |
          git push origin ${{ github.ref_name }}
